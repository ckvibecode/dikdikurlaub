databases:
  - name: dikdik-urlaubsapp-db
    plan: free
    databaseName: dikdik
    user: dikdik

services:
  - type: web
    name: dikdik-urlaubsapp-web
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy && npx prisma db seed
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dikdik-urlaubsapp-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: TRIP_CODE
        sync: false
      - key: TRIP_NAME
        sync: false
      - key: TRIP_START_DATE
        sync: false
      - key: TRIP_END_DATE
        sync: false
